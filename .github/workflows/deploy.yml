name: Test and deploy to Azure

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  RESOURCE_GROUP: rg-az104-arm-lab
  CONTAINER_APP: propertyops-ai-agent
  ACR_NAME: az1600propertyops22764
  IMAGE_NAME: propertyops-ai-agent

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-subtests

      - name: Run tests
        run: python -m pytest -q

  deploy:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Azure using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to Azure Container Registry
        run: |
          az acr login \
            --name "$ACR_NAME"

      - name: Build and push container image
        run: |
          IMAGE="$ACR_NAME.azurecr.io/$IMAGE_NAME:${GITHUB_SHA}"

          docker build \
            --platform linux/amd64 \
            -t "$IMAGE" \
            .

          docker push "$IMAGE"

          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy to Azure Container Apps
        run: |
          az containerapp update \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$IMAGE"

      - name: Show deployed revision
        run: |
          az containerapp show \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --query "{image:properties.template.containers[0].image,fqdn:properties.configuration.ingress.fqdn}" \
            -o table