name: Test and deploy to Azure

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

env:
  RESOURCE_GROUP: rg-az104-arm-lab
  CONTAINER_APP: propertyops-ai-agent
  ACR_NAME: az1600propertyops22764
  IMAGE_NAME: propertyops-ai-agent

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-subtests

      - name: Run tests
        run: python -m pytest -q --junitxml=test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-test-results
          path: test-results.xml
          if-no-files-found: ignore

  validate-infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BICEP_CLI_VERSION: v0.47.16

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pinned Bicep CLI
        run: az bicep install --version "$BICEP_CLI_VERSION"

      - name: Compile all Bicep templates
        run: bash scripts/validate-infra.sh

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [test, validate-infrastructure]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Azure using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to Azure Container Registry
        run: |
          az acr login \
            --name "$ACR_NAME"

      - name: Build and push container image
        run: |
          IMAGE="$ACR_NAME.azurecr.io/$IMAGE_NAME:${GITHUB_SHA}"

          docker build \
            --platform linux/amd64 \
            -t "$IMAGE" \
            .

          docker push "$IMAGE"

          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy to Azure Container Apps
        run: |
          az containerapp update \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$IMAGE"

      - name: Show deployed revision
        run: |
          az containerapp show \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --query "{image:properties.template.containers[0].image,fqdn:properties.configuration.ingress.fqdn}" \
            -o table
